<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sage Journal — Create Account</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">

            <div class="brand-mark">
                S
            </div>

            <div>
                <h1>Sage</h1>
                <span>Journal</span>
            </div>

        </div>


        <div class="auth-heading">

            <h2>
                Create your account
            </h2>

            <p>
                Start tracking your trades and improving your edge.
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="registerName">
                    Display name
                </label>

                <input
                    type="text"
                    id="registerName"
                    name="displayName"
                    placeholder="Your name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
    type="password"
    id="registerPassword"
    name="password"
    placeholder="Create a password"
    autocomplete="new-password"
    minlength="8"
    required
                    >
                

            </div>


            <p
                id="registerError"
                class="auth-error"
            ></p>


            <button
                type="submit"
                class="primary-btn auth-submit"
            >
                Create Account
            </button>

        </form>


        <div class="auth-switch">

            <span>
                Already have an account?
            </span>

            <a href="./login.html">
                Login
            </a>

        </div>

    </div>

</main>

<script src="js/app.js?v=3"></script>

</body>
</html>
