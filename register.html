<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sage Journal — Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand auth-brand">

            <div class="brand-mark">
                S
            </div>

            <div>
                <h2>Sage</h2>
                <span>Journal</span>
            </div>

        </div>


        <div class="auth-heading">

            <h1>Create account</h1>

            <p>
                Start tracking your trading performance.
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Your name"
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn auth-button"
            >
                Create Account
            </button>


            <p
                id="registerError"
                class="auth-error"
            ></p>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
