<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sage Journal — Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand auth-brand">

            <div class="brand-mark">
                S
            </div>

            <div>
                <h2>Sage</h2>
                <span>Journal</span>
            </div>

        </div>


        <div class="auth-heading">

            <h1>Welcome back</h1>

            <p>
                Log in to your trading journal.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn auth-button"
            >
                Login
            </button>


            <p
                id="loginError"
                class="auth-error"
            ></p>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
