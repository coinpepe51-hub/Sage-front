<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sage Journal — Login</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">

            <div class="brand-mark">
                S
            </div>

            <div>
                <h1>Sage</h1>
                <span>Journal</span>
            </div>

        </div>


        <div class="auth-heading">

            <h2>
                Welcome back
            </h2>

            <p>
                Login to continue to your trading journal.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <p
                id="loginError"
                class="auth-error"
                aria-live="polite"
            ></p>


            <button
                type="submit"
                class="primary-btn auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-switch">

            <span>
                Don't have an account?
            </span>

            <a
                href="./register.html"
                id="createAccountLink"
            >
                Create account
            </a>

        </div>

    </div>

</main>


<script src="./js/app.js"></script>

</body>
</html>
